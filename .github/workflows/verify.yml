name: Verify released evidence
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute paired results
        run: python evidence/audit_new_results.py
      - name: Recompute extended evidence
        run: |
          python -m pip install 'numpy>=1.26,<3'
          python evidence/extended/audit_extended.py
      - name: Check source syntax
        run: python -m compileall -q experiments scripts edits
